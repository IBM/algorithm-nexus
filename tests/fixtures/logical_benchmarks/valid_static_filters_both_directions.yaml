# Binding uses both experimentFilters and benchmarkFilters under staticFilters

logicalBenchmark:
  benchmarkIdentifier: graph_coloring
  description: "Graph coloring benchmark"
  instance:
    - identifier: num_vertices
    - identifier: graph_family

bindings:
  - experiment:
      actuatorIdentifier: custom_experiments
      experimentIdentifier: rlx_coloring
      experimentVersion: 1.0.0
    instanceMapping:
      - benchmark:
          identifier: num_vertices
        experiment:
          identifier: n_nodes
    staticFilters:
      experimentFilters:
        - property:
            identifier: graph_type
          value: erdos_renyi
      benchmarkFilters:
        - property:
            identifier: graph_family
          value: random_regular
