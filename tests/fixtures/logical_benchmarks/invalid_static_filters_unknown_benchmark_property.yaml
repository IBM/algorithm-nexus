# benchmarkFilters references 'nonexistent_prop' which is not in the definition

logicalBenchmark:
  benchmarkIdentifier: graph_coloring
  description: "Graph coloring benchmark"
  instance:
    - identifier: num_vertices

bindings:
  - experiment:
      actuatorIdentifier: custom_experiments
      experimentIdentifier: rlx_coloring
      experimentVersion: 1.0.0
    staticFilters:
      benchmarkFilters:
        - property:
            identifier: nonexistent_prop
          value: random_regular
