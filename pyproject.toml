[project]
name = "algorithm-nexus"
description = "A comprehensive library for AI model delivery, testing, and benchmarking"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license-files = ["LICENSE"]
authors = [{ name = "Christian Pinto", email = "christian.pinto@ibm.com" }]
maintainers = [{ name = "Christian Pinto", email = "christian.pinto@ibm.com" }]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/IBM/algorithm-nexus"
Issues = "https://github.com/IBM/algorithm-nexus/issues"
Repository = "https://github.com/IBM/algorithm-nexus"

[project.scripts]
nexus = "algorithm_nexus.cli:main"

[project.optional-dependencies]
candidate = [
  "biomed-multi-alignment[vllm]",
  "bmfm-targets[vllm]>=0.20.0",
  # NOTE: pending the gridfm-graphkit release that ships the vLLM serving
  # subpackage + `vllm` extra + entry points (see PR description). 0.9.0 on PyPI
  # does NOT contain it; 0.9.1 is the intended servable release. Its `vllm` extra
  # targets vllm>=0.26,<0.27, matching this candidate variant (vllm==0.26.0);
  # it is intentionally NOT added to `product` (vllm>=0.28) until validated there.
  "gridfm-graphkit[vllm]==0.9.1",
  # CP 02/07/2026
  # Scanners are flagging opencv-python-headless==5.0.0.93 as
  # potentially malicious. While we think it's a false positive,
  # we use this qualifier to prevent installing a potentially malicious library.
  # This dependency is added by vLLM and TerraTorch
  "opencv-python-headless!=5.0.0.93",
  "terrakit==0.2.0",
  "terratorch[vllm]==1.2.10",
  "vllm==0.26.0",
]
cli = [
  "ado-core>=2.0",
  "pydantic>=2.13.3",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "typer>=0.25.0",
]
ecosystem = [
  "biomed-multi-alignment",
  "bmfm-targets",
  "gridfm-graphkit==0.9.1",
  "terrakit>=0.2.0",
  "terratorch>=1.2.7",
  "tokamind",
]
product = [
  # CP 02/07/2026
  # Scanners are flagging opencv-python-headless==5.0.0.93 as
  # potentially malicious. While we think it's a false positive,
  # we use this qualifier to prevent installing a potentially malicious library.
  # This dependency is added by vLLM and TerraTorch
  "opencv-python-headless!=5.0.0.93",
  "terrakit==0.2.0",
  "terratorch[vllm]==1.2.13",
  "vllm>=0.28.0,<0.29.0",
]

[dependency-groups]
dev = [
  "black>=25.1.0",
  "codespell>=2.4.0",
  "detect-secrets @ git+https://github.com/ibm/detect-secrets.git",
  "pre-commit>=4.2.0",
  "ruff>=0.12.0",
  "zensical>=0.0.40",
]
test = [
  "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv]
package = true
conflicts = [
  [
    { extra = "ecosystem" },
    { extra = "candidate" },
    { extra = "product" },
  ],
]

# gridfm-graphkit (>=0.9) depends on torch-scatter, whose sdist imports torch at
# build time without declaring it as a build dependency. Inject torch into its
# build environment so `uv lock` can generate its metadata. (Must sit after all
# flat [tool.uv] keys above, or it orphans them.)
[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]

[tool.uv.sources]
bmfm-targets = { git = "https://github.com/BiomedSciAI/biomed-multi-omic.git" }
tokamind = { git = "https://github.com/UKAEA-IBM-STFC-Fusion-FMs/tokamind", tag = "OS_v2.0" }
biomed-multi-alignment = { git = "https://github.com/BiomedSciAI/biomed-multi-alignment", rev = "0.2.5" }

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
