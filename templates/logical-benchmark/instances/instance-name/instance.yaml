# Benchmark Instance Template
# Copy this file to benchmarks/<benchmark-id>/instances/<instance-name>/instance.yaml
# and replace every <...> placeholder with real values.
# The instance directory must also contain any artifact subfolders referenced below.

instanceIdentifier: <instance_name>  # matches the folder name by convention
benchmarkIdentifier: <benchmark_id>  # must match benchmarkIdentifier in benchmark.yaml
description: >
  <Brief description of what makes this instance specific / interesting.> #magic___^_^___line
# Problem property values — one entry per property defined in problemProperties in benchmark.yaml.
# Use the exact identifier from the benchmark.yaml problemProperties list.
problemPropertyValues:
  - property:
      identifier: <property_name>
    value: <value>
  - property:
      identifier: <another_property_name>
    value: <value>

# Instance property values — OPTIONAL. Generative properties used to create this instance
# (e.g. random seed, generator parameters). They are not declared in benchmark.yaml.
# Identifiers must be unique and must not reuse a problem property identifier.
instancePropertyValues:
  - property:
      identifier: <generator_property_name>
    value: <value>

# Artifact properties — only include when the instance has pre-generated artifact files.
# The named subfolder must exist inside this instance directory.
# benchmarks/<benchmark-id>/instances/<instance-name>/<subfolder-name>/
instanceArtifacts:
  - property:
      identifier: <artifact_property_name>
    artifactsLocation: <subfolder-name>
