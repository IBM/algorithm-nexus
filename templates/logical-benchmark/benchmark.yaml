# Logical Benchmark Definition Template
# Copy this file to benchmarks/<benchmark-id>/benchmark.yaml and replace every
# <...> placeholder with real values. Remove optional fields that do not apply.
#
# Bindings live in experiments/<experiment-name>/bindings/<binding-name>.yaml,
# not in this file.

logicalBenchmark:
  benchmarkIdentifier: <benchmark_id>  # snake_case unique identifier
  title: <Human-Readable Title>
  description: >
    <One-paragraph description of the abstract problem being evaluated.>
  instance:
    # --- scalar property (categorical) ---
    - identifier: <property_name>
      metadata:
        description: <What this property captures.>
      propertyDomain:
        variableType: CATEGORICAL_VARIABLE_TYPE
        values: [<value_a>, <value_b>]
    # --- scalar property (continuous) ---
    - identifier: <property_name>
      metadata:
        description: <What this property captures.>
      propertyDomain:
        variableType: CONTINUOUS_VARIABLE_TYPE
        domainRange: [<min>, <max>]  # optional: omit for unbounded
    # --- artifact property ---
    - identifier: <property_name>
      is_artifact: true
      metadata:
        description: <Description of the artifact file(s).>
  metrics:
    - <canonical_metric_name_1>
    - <canonical_metric_name_2>
  ranking:
    metric: <canonical_metric_name_1>
    order: asc  # "asc" = lower-is-better, "desc" = higher-is-better
  owner: <team-or-username>  # optional
