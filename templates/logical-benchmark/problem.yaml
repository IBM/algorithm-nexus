# Logical Benchmark Definition + Bindings Template
# Copy this file to benchmarks/<benchmark-id>/problem.yaml and replace every
# <...> placeholder with real values. Remove optional fields that do not apply.

logicalBenchmark:
  benchmarkIdentifier: <benchmark_id>  # snake_case unique identifier
  title: <Human-Readable Title>
  description: >
    <One-paragraph description of the abstract problem being evaluated.>
  instance:
    # --- scalar property (categorical) ---
    - identifier: <property_name>
      metadata:
        description: <What this property captures.>
      propertyDomain:
        variableType: CATEGORICAL_VARIABLE_TYPE
        values: [<value_a>, <value_b>]
    # --- scalar property (continuous) ---
    - identifier: <property_name>
      metadata:
        description: <What this property captures.>
      propertyDomain:
        variableType: CONTINUOUS_VARIABLE_TYPE
        domainRange: [<min>, <max>]  # optional: omit for unbounded
    # --- artifact property ---
    - identifier: <property_name>
      is_artifact: true
      metadata:
        description: <Description of the artifact file(s).>
  metrics:
    - <canonical_metric_name_1>
    - <canonical_metric_name_2>
  ranking:
    metric: <canonical_metric_name_1>
    order: asc  # "asc" = lower-is-better, "desc" = higher-is-better
  owner: <team-or-username>  # optional

bindings:
  - experiment:
      actuatorIdentifier: <actuator_id>
      experimentIdentifier: <experiment_id>
      experimentVersion: <major.minor.patch>

    # Optional: override the leaderboard row label (defaults to experiment id)
    # targetMapping: <property_name_or_custom_label>

    # Field mapping — rename an experiment property to its benchmark equivalent.
    # Use categoricalValue entries when a benchmark category maps to a predicate
    # over experiment properties rather than a single renamed field.
    instanceMapping:
      # Field mapping (1-to-1 property rename)
      - benchmark:
          identifier: <benchmark_instance_property>
        experiment:
          identifier: <experiment_property_name>
      # Categorical value mapping (1 benchmark category → experiment predicate)
      - categoricalValue:
          property:
            identifier: <benchmark_instance_property>
          value: <category_value>
        predicate:
          - identifier: <experiment_property_name>
            propertyDomain:
              variableType: CATEGORICAL_VARIABLE_TYPE
              values: [<exp_value>]

    # Metric renaming — omit entries whose names already match the benchmark
    metricMapping:
      - benchmark:
          identifier: <canonical_metric_name_1>
        experiment:
          identifier: <experiment_metric_name>

    # Static filters — pin values that are implicit in this binding.
    # Either sub-key may be omitted when only one direction is needed.
    staticFilters:
      # Fix an experiment property to a value required by the benchmark
      experimentFilters:
        - property:
            identifier: <experiment_property_name>
          value: <value>
      # Assert a benchmark instance property always implied by this experiment
      # (must not also appear in instanceMapping)
      benchmarkFilters:
        - property:
            identifier: <benchmark_instance_property>
          value: <value>
