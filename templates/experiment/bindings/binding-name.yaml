# Benchmark Instance Binding Template (optional)
# Place this file at experiments/<experiment-name>/bindings/<binding-name>.yaml
# Only needed when connecting this experiment to a benchmark instance.
# Each file contains exactly one binding at the top level.
# See templates/logical-benchmark/binding.yaml for the full binding schema.

instanceBindingIdentifier: <binding_id>  # unique identifier for this binding
instanceReference: <benchmark_id>/<instance_id>  # benchmarkIdentifier/instanceIdentifier

experiment:
  actuatorIdentifier: custom_experiments
  experimentIdentifier: <experiment-id>  # must match an id in experiment_package.yaml
  experimentVersion: <major.minor.patch>

problemPropertyMapping:
  - instance:
      identifier: <benchmark_instance_property>
    experiment:
      identifier: <experiment_property_name>

instanceArtifactMapping:
  - instance:
      identifier: <artifact_property_name>
    experiment:
      identifier: <experiment_input_property>
    validValues:
      - <filename.ext>

metricMapping:
  - benchmark:
      identifier: <canonical_metric_name>
    experiment:
      identifier: <experiment_metric_name>
